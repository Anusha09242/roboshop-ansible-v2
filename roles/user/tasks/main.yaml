- name: system setup
  import_role:
    name: common
    tasks_from: app-setup
- name: nodejs setup
  import_role:
    name: common
    tasks_from: nodejs
- name: systemd setup
  import_role:
    name: common
    tasks_from: systemd-setup
- name: restart and enable user
  service:
    name: user
    state: restarted
    enabled: yes